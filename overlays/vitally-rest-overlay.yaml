overlay: 1.0.0
info:
  title: API Evangelist enhancements for Vitally REST API
  version: 1.0.0
extends: openapi/vitally-rest-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-21'
      x-apievangelist-method: generated
      x-apievangelist-source: https://docs.vitally.io/en/articles/9880649-rest-api-overview
