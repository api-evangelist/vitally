    update:
      x-authentication: authentication/vitally-authentication.yml
      x-conventions: conventions/vitally-conventions.yml
      x-error-catalog: errors/vitally-problem-types.yml
      x-rate-limits: rate-limits/vitally-rate-limits.yml
      x-lifecycle: lifecycle/vitally-lifecycle.yml
      x-data-model: data-model/vitally-data-model.yml
      x-mcp-server: mcp/vitally-mcp.yml
  - target: $.info
    update:
      x-agentic-access: agentic-access/vitally-agentic-access.yml
