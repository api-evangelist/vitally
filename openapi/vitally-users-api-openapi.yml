          - string
          - 'null'
        mrr:
          type:
          - number
          - 'null'
        nextRenewalDate:
          type:
          - string
          - 'null'
          format: date-time
        churnedAt:
          type:
          - string
          - 'null'
          format: date-time
        firstSeenTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        lastSeenTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        lastInboundMessageTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        lastOutboundMessageTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        trialEndDate:
          type:
          - string
          - 'null'
          format: date-time
        usersCount:
