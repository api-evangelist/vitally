openapi: 3.1.0
info:
  title: Vitally REST API
  version: '1.0'
  x-generated: '2026-07-21'
  x-method: generated
  x-source: >-
    https://docs.vitally.io/en/articles/9880649-rest-api-overview and the
    per-resource REST API reference articles (accounts, users, tasks,
    organizations, notes, conversations, npsResponses, admins, customObjects).
    Operations, hosts, authentication, pagination and error semantics are taken
    verbatim from Vitally's published documentation; object schemas for Account,
    User and Task are transcribed from their documented object tables. Not a
    provider-published OpenAPI — a faithful generation from the public docs.
  description: >-
    Vitally's public REST API for creating, updating, retrieving and listing the
    core Customer Success objects — Accounts, Organizations, Users, Tasks, Notes,
    Conversations and NPS Responses. Authentication is HTTP Basic using a
    Vitally REST API key as the username. List endpoints use cursor-based
    pagination ordered by updatedAt (default) or createdAt.
  contact:
    name: Vitally
    url: https://docs.vitally.io/en/articles/9880649-rest-api-overview
servers:
  - url: https://{subdomain}.rest.vitally.io/resources
    description: US data center (default)
    variables:
      subdomain:
        default: yoursubdomain
        description: Your Vitally subdomain (from your login URL yoursubdomain.vitally.io)
  - url: https://rest.vitally-eu.io/resources
    description: EU data center
security:
  - basicAuth: []
tags:
  - name: Accounts
  - name: Organizations
  - name: Users
  - name: Tasks
  - name: Notes
  - name: Conversations
  - name: NPS Responses
  - name: Admins
  - name: Custom Objects
paths:
  /accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List accounts
      description: Paginated list of Accounts, by default ordered by updatedAt descending.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/sortBy'
        - name: status
          in: query
          description: One of active (default), churned, or activeOrChurned.
          schema:
            type: string
            enum: [active, churned, activeOrChurned]
            default: active
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountWrite'
      responses:
        '200':
          description: The created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/accountId'
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get an account
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateAccount
      tags: [Accounts]
      summary: Update an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountWrite'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteAccount
      tags: [Accounts]
      summary: Delete an account
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
