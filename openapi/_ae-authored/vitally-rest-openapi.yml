components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic authentication. Use your Vitally REST API key as the username
        with an empty password (Authorization: Basic base64(apiKey:)). Keys are
        created in the Vitally UI under Settings -> Integrations -> Vitally REST API.
  parameters:
    limit:
      name: limit
      in: query
      description: Number of items to return. Max/default is 100.
      schema:
        type: integer
        maximum: 100
        default: 100
    from:
      name: from
      in: query
      description: The cursor returned from a previous request (from the next property).
      schema:
        type: string
    sortBy:
      name: sortBy
      in: query
      description: How to order results. Default updatedAt.
      schema:
        type: string
        enum: [createdAt, updatedAt]
        default: updatedAt
    accountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad Request - the body of the request needs to be reviewed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - there is an issue with the authorization used
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too Many Requests - rate limit exceeded (default 1000 requests/min)
      headers:
        RateLimit-Limit:
          schema:
            type: string
          description: 'e.g. 1000, 1000;window=60'
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
      required: [error]
    Cursor:
      type: object
      properties:
        next:
          type: [string, 'null']
          description: The cursor to use for the following page, or null at the end.
    Account:
      type: object
      properties:
        id:
          type: string
          description: Vitally's unique ID for the account
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        externalId:
          type: string
          description: Your unique ID for the account
        name:
          type: string
        traits:
          type: object
          additionalProperties: true
        organizationId:
          type: [string, 'null']
        accountOwnerId:
          type: [string, 'null']
        mrr:
          type: [number, 'null']
        nextRenewalDate:
          type: [string, 'null']
          format: date-time
        churnedAt:
          type: [string, 'null']
          format: date-time
        firstSeenTimestamp:
          type: [string, 'null']
          format: date-time
        lastSeenTimestamp:
          type: [string, 'null']
          format: date-time
        lastInboundMessageTimestamp:
          type: [string, 'null']
          format: date-time
        lastOutboundMessageTimestamp:
          type: [string, 'null']
          format: date-time
        trialEndDate:
          type: [string, 'null']
          format: date-time
        usersCount:
          type: integer
        npsDetractorCount:
          type: integer
        npsPassiveCount:
          type: integer
        npsPromoterCount:
          type: integer
        npsScore:
          type: [number, 'null']
          description: NPS score across all users (-100 to 100)
        healthScore:
          type: [number, 'null']
          description: Current health score (0-10)
        csmId:
          type: [string, 'null']
        accountExecutiveId:
          type: [string, 'null']
        keyRoles:
          type: array
          items:
            type: object
            properties:
              vitallyUser:
                type: object
              keyRole:
                type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SegmentRef'
      required: [id, name]
    AccountWrite:
      type: object
      properties:
        externalId:
          type: string
        name:
          type: string
        organizationId:
          type: [string, 'null']
        accountOwnerId:
          type: [string, 'null']
        traits:
          type: object
          additionalProperties: true
      required: [name]
    User:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        externalId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: [string, 'null']
        traits:
          type: object
          additionalProperties: true
        firstKnown:
          type: [string, 'null']
          format: date-time
        lastSeenTimestamp:
          type: [string, 'null']
          format: date-time
        lastInboundMessageTimestamp:
          type: [string, 'null']
          format: date-time
        lastOutboundMessageTimestamp:
          type: [string, 'null']
          format: date-time
        npsLastScore:
          type: [number, 'null']
        npsLastFeedback:
          type: [string, 'null']
        npsLastRespondedAt:
          type: [string, 'null']
          format: date-time
        unsubscribedFromConversations:
          type: boolean
        unsubscribedFromConversationsAt:
          type: [string, 'null']
          format: date-time
        deactivatedAt:
          type: [string, 'null']
          format: date-time
        permanentlyBounced:
          type: boolean
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SegmentRef'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/GenericObject'
      required: [id, name]
    UserWrite:
      type: object
      properties:
        externalId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
        traits:
          type: object
          additionalProperties: true
        accountIds:
          type: array
          items:
            type: string
      required: [name]
    Task:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        externalId:
          type: string
        organizationId:
          type: [string, 'null']
        accountId:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
          description: The body of the task; may include a restricted set of HTML tags.
        completedAt:
          type: [string, 'null']
          format: date-time
        dueDate:
          type: [string, 'null']
        tags:
          type: array
          items:
            type: string
        archivedAt:
          type: [string, 'null']
          format: date-time
        meetingId:
          type: [string, 'null']
        source:
          type: [string, 'null']
        categoryId:
          type: [string, 'null']
        assignedToId:
          type: [string, 'null']
        completedById:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/TaskCategory'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/SegmentRef'
        traits:
          type: object
          additionalProperties: true
      required: [id, name, accountId]
    TaskWrite:
      type: object
      properties:
        externalId:
          type: string
        organizationId:
          type: string
        accountId:
          type: string
        name:
          type: string
        description:
          type: string
        dueDate:
          type: string
        completedAt:
          type: string
          format: date-time
        assignedToId:
          type: string
        completedById:
          type: string
        tags:
          type: array
          items:
            type: string
        traits:
          type: object
          additionalProperties: true
      required: [name, accountId]
    TaskCategory:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
    NoteWrite:
      type: object
      properties:
        externalId:
          type: string
        accountId:
          type: string
        organizationId:
          type: string
        note:
          type: string
          description: The body of the note; may include a restricted set of HTML tags.
        tags:
          type: array
          items:
            type: string
        traits:
          type: object
          additionalProperties: true
      required: [note]
    SegmentRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    GenericObject:
      type: object
      description: >-
        Common Vitally object envelope. Every REST object exposes id, createdAt,
        updatedAt, externalId, name and a traits map; resource-specific fields
        are documented per resource.
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        externalId:
          type: [string, 'null']
        name:
          type: [string, 'null']
        traits:
          type: object
          additionalProperties: true
      additionalProperties: true
    GenericWrite:
      type: object
      properties:
        externalId:
          type: string
        name:
          type: string
        accountId:
          type: string
        organizationId:
          type: string
        traits:
          type: object
          additionalProperties: true
      additionalProperties: true
    AccountList:
      allOf:
        - $ref: '#/components/schemas/Cursor'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/Account'
    UserList:
      allOf:
        - $ref: '#/components/schemas/Cursor'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/User'
    TaskList:
      allOf:
        - $ref: '#/components/schemas/Cursor'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/Task'
    ObjectList:
      allOf:
        - $ref: '#/components/schemas/Cursor'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/GenericObject'
