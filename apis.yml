aid: vitally
name: Vitally
description: >-
  Vitally is an AI-powered Customer Success platform (CSP) that unifies
  customer data, health scores, and revenue context with workflow automation —
  Hubs, automated Playbooks, Docs, Projects, and NPS and custom surveys —
  plus Vitally AI (Copilot, Summaries, Meeting Recorder). Its public REST API
  exposes the core Customer Success objects (accounts, organizations, users,
  tasks, notes, conversations, NPS responses, custom objects) over HTTP Basic
  auth with cursor pagination and RateLimit headers, and an official remote
  MCP server (Beta) connects MCP-compatible AI clients to a Vitally workspace.
