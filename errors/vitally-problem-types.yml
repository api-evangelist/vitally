problems:
  - status: 400
    title: Bad Request
    meaning: The body of the request needs to be reviewed (malformed or invalid payload).
    action: Correct the request body and retry.
  - status: 401
    title: Unauthorized
    meaning: >-
      There is an issue with the authorization used (secret token / Basic Auth
      header missing or invalid).
    action: Provide a valid Authorization Basic header using an active REST API key.
    observed_body: '{"error":"Authorization header not present."}'
  - status: 429
    title: Too Many Requests
    meaning: >-
      Too many requests within the allotted timeframe (over the default
      1000 requests/min budget).
    action: >-
      Back off using the RateLimit-Reset header; reduce request rate or batch
      writes.
